[project]
name = "crowd-checker"
version = "0.1.0"
description = "App to check crowd status of particular establishments - For Ateneo MSDS (Ramoncito Jr Bangit)"
authors = [
    {name = "Ramoncito Jr Bangit"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "django[gis] (>=5.1.6,<6.0.0)",
    "djangorestframework (>=3.15.2,<4.0.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "pgvector (>=0.3.6,<0.4.0)",
    "geopandas (>=1.0.1,<2.0.0)",
    "transformers (>=4.49.0,<5.0.0)",
    "langchain (>=0.3.19,<0.4.0)",
    "torch (>=2.6.0,<3.0.0)",
    "langchain-community (>=0.3.18,<0.4.0)",
    "sentence-transformers (>=3.4.1,<4.0.0)",
    "gdal (>=3.10.2,<4.0.0)",
    "openai (>=1.63.2,<2.0.0)",
    "shapely (>=2.1.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
